[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mission3-mcp"
version = "0.2.0"
description = "Mission 3: MCP-powered agents"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3,<2.0",
    "langchain-deepseek>=1.0.1,<2.0",
    "mcp>=1.27,<2.0",
    "langchain-mcp-adapters>=0.2,<1.0",
    "python-dotenv>=1.2,<2.0",
    "requests>=2.32,<3.0",
    "tzdata>=2024.1",
    "gradio>=5.0,<6.0",
]

[tool.setuptools]
py-modules = []

[tool.vercel]
entrypoint = "app.py"

